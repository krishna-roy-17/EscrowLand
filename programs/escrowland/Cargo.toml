[package]
name = "escrowland"
version = "0.2.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "escrowland"
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build"]
[dependencies]
anchor-lang = "0.31.1"
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
